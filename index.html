    @keyframes flipPrev {

      margin: 2px 2px;

      display: inline-block;
      padding: 2px 7px;
      border-radius: 8px;

      transition: all 0.18s ease;
      user-select: none;
      font-size: 1.25rem;
      font-weight: 500;

    .interactive-word:hover {

      color: #854d0e;
      transform: scale(1.08);
      box-shadow: 0 4px 8px -2px rgba(0, 0, 0, 0.12);

      background-color: #fde047;
      color: #713f12;
      font-weight: 700;
      box-shadow: 0 0 0 3px #eab308;
    }

    /* Inline Popover Tooltip Balloon */
    .word-tooltip-popover {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      min-width: 220px;
      max-width: 280px;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .word-tooltip-popover::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px;
      border-style: solid;
      border-color: #1e1b4b transparent transparent transparent;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) scale(0.8) translateY(10px); }
      100% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    }

    // Helper for converting PCM16 audio from Gemini TTS into WAV
    function pcmToWav(pcm16Data, sampleRate = 24000) {
      const numChannels = 1;
      const byteRate = sampleRate * numChannels * 2;
      const blockAlign = numChannels * 2;
      const dataSize = pcm16Data.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcm16Data.length; i++, offset += 2) {
        view.setInt16(offset, pcm16Data[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Sound effect generator for realistic page turns using Web Audio API
    function playPageFlipSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const bufferSize = ctx.sampleRate * 0.12;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.12);
        noise.connect(filter);
        filter.connect(ctx.destination);
        noise.start();
      } catch (e) {
        // Audio API fallback silently
      }
    }

            questionHebrew: "על מה אדם ומשפחתו יושבים על הדשא?",
            questionEnglish: "What do Adam and his family sit on?",
            hintHebrew: "רמז: קראי את משפט 2 ושימי לב לצבע השמיכה הפרוסה.",
            options: [
              "על שמיכה אדומה גדולה (On a big red blanket)",
              "על כיסאות עץ (On wooden chairs)",
              "על מחצלת צהובה (On a yellow mat)",
              "על אבנים (On stones)"
            ],
            correct: 0,
            explanation: "נכון מאוד! הם יושבים על שמיכה אדומה גדולה."
          },
          {
            id: 'q2',
            lineRef: "משפט 4",
            questionHebrew: "איזה משקה אדם שותה להתרעננות?",
            questionEnglish: "What drink does Adam enjoy?",
            hintHebrew: "רמז: התבונני במשפט 4 וחפשי את פרי ההדר הכתום.",
            options: [
              "מיץ תפוזים קר וטרי (Cold fresh orange juice)",
              "מים חמים (Hot water)",
              "חלב (Milk)",
              "מיץ ענבים (Grape juice)"
            ],
            correct: 0,
            explanation: "מצוין! אדם שותה מיץ תפוזים קר וטרי."
          }
        ],
        dictionary: {
          "picnic": { hebrew: "פיקניק", pos: "שם עצם", example: "A fun picnic." },
          "blanket": { hebrew: "שמיכה", pos: "שם עצם", example: "A red blanket." },
          "grass": { hebrew: "דשא", pos: "שם עצם", example: "Green grass." },
          "strawberries": { hebrew: "תותים", pos: "שם עצם", example: "Sweet strawberries." },
          "sandwiches": { hebrew: "כריכים / סנדוויצ'ים", pos: "שם עצם", example: "Tasty sandwiches." },
          "juice": { hebrew: "מיץ", pos: "שם עצם", example: "Orange juice." },
          "perfect": { hebrew: "מושלם", pos: "תואר", example: "A perfect day." }
        }
      }
    ];

    function App() {
      const [stories, setStories] = useState(SAMPLE_STORIES_3RD_GRADE);
      const [currentStoryIndex, setCurrentStoryIndex] = useState(0);
      const [selectedWordInfo, setSelectedWordInfo] = useState(null);
      const [activeWordRef, setActiveWordRef] = useState(null);
      const [showHintMap, setShowHintMap] = useState({});
      const [pageTurnAnimation, setPageTurnAnimation] = useState('');

      // Audio & Speech States
      const [isPlayingText, setIsPlayingText] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(0.8); // Recommended slow for 3rd grade
      const [voiceSource, setVoiceSource] = useState('browser');
      const [geminiApiKey, setGeminiApiKey] = useState('');

      // Quiz & Word Notebook
      const [userAnswers, setUserAnswers] = useState({});
      const [showResults, setShowResults] = useState(false);
      const [savedWords, setSavedWords] = useState([]);

      // Modals & Toast
      const [showVocabularyModal, setShowVocabularyModal] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const audioRef = useRef(null);
      const currentStory = stories[currentStoryIndex];

      const notify = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      useEffect(() => {
        setUserAnswers({});
        setShowResults(false);
        setShowHintMap({});
        setSelectedWordInfo(null);
        stopSpeech();
      }, [currentStoryIndex]);

      const goToNextPage = () => {
        if (currentStoryIndex < stories.length - 1) {
          playPageFlipSound();
          setPageTurnAnimation('page-turn-next');
          setCurrentStoryIndex(prev => prev + 1);
          setTimeout(() => setPageTurnAnimation(''), 550);
        }
      };

      const goToPrevPage = () => {
        if (currentStoryIndex > 0) {
          playPageFlipSound();
          setPageTurnAnimation('page-turn-prev');
          setCurrentStoryIndex(prev => prev - 1);
          setTimeout(() => setPageTurnAnimation(''), 550);
        }
      };

      const toggleHint = (qId) => {
        setShowHintMap(prev => ({ ...prev, [qId]: !prev[qId] }));
      };

      const handleWordClick = async (word, contextSentence, e) => {
        e.stopPropagation();
        const cleanWord = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "").trim();
        if (!cleanWord) return;

        // Toggle off if already selected
        if (selectedWordInfo && selectedWordInfo.word.toLowerCase() === cleanWord.toLowerCase()) {
          setSelectedWordInfo(null);
          return;
        }

        // Check local dictionary
        const dictMatch = currentStory.dictionary && currentStory.dictionary[cleanWord.toLowerCase()];
        if (dictMatch) {
          setSelectedWordInfo({
            word: cleanWord,
            hebrew: dictMatch.hebrew,
            pos: dictMatch.pos || 'מילה',
            example: dictMatch.example || contextSentence,
            sentence: contextSentence
          });
          speakText(cleanWord, 'en-US');
          return;
        }

        // Fallback or Gemini AI translation
        setSelectedWordInfo({ word: cleanWord, hebrew: 'מתרגם מילה...', pos: 'טוען...', sentence: contextSentence });
        speakText(cleanWord, 'en-US');

        try {
          const prompt = `Translate the English word "${cleanWord}" to simple Hebrew suitable for a 3rd grader in context: "${contextSentence}". Return ONLY JSON: {"hebrew": "תרגום פשוט", "pos": "חלק דיבור"}`;
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiApiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (!response.ok) throw new Error("API call failed");
          const data = await response.json();
          const parsed = JSON.parse(data.candidates[0].content.parts[0].text);

          setSelectedWordInfo({
            word: cleanWord,
            hebrew: parsed.hebrew || 'תרגום אינו זמין',
            pos: parsed.pos || 'מילה',
            example: contextSentence,
            sentence: contextSentence
          });
        } catch (err) {
          setSelectedWordInfo({
            word: cleanWord,
            hebrew: 'תרגום לפי הקשר הקריאה',
            pos: 'מילה',
            example: contextSentence,
            sentence: contextSentence
          });
        }
      };

      const speakText = async (textToRead, lang = 'en-US') => {
        stopSpeech();

        if (voiceSource === 'gemini' && geminiApiKey) {
          try {
            notify("מכין הקראה בקול אנושי טבעי...");
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${geminiApiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: textToRead }] }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                }
              })
            });

            if (!response.ok) throw new Error("TTS failed");
            const result = await response.json();
            const part = result?.candidates?.[0]?.content?.parts?.[0];
            const audioData = part?.inlineData?.data;

            if (audioData) {
              const buffer = base64ToArrayBuffer(audioData);
              const pcm16 = new Int16Array(buffer);
              const wavBlob = pcmToWav(pcm16, 24000);
              const audioUrl = URL.createObjectURL(wavBlob);

              if (audioRef.current) {
                audioRef.current.src = audioUrl;
                audioRef.current.playbackRate = playbackRate;
                audioRef.current.play();
                setIsPlayingText(true);
                audioRef.current.onended = () => setIsPlayingText(false);
              }
              return;
            }
          } catch (e) {
            notify("עובר להקראת דפדפן standard...");
          }
        }

        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(textToRead);
          utterance.lang = lang;
          utterance.rate = playbackRate;
          utterance.onstart = () => setIsPlayingText(true);
          utterance.onend = () => setIsPlayingText(false);
          window.speechSynthesis.speak(utterance);
        } else {
          notify("הדפדפן שלך אינו תומך בהקראת קול");
        }
      };

      const stopSpeech = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current.currentTime = 0;
        }
        setIsPlayingText(false);
      };

      const handleOptionSelect = (qId, optionIndex) => {
        setUserAnswers(prev => ({ ...prev, [qId]: optionIndex }));
      };

      const calculateScore = () => {
        let correctCount = 0;
        currentStory.questions.forEach(q => {
          if (userAnswers[q.id] === q.correct) correctCount++;
        });
        return {
          score: correctCount,
          total: currentStory.questions.length,
          percentage: Math.round((correctCount / currentStory.questions.length) * 100)
        };
      };

      const handleCheckQuiz = () => {
        setShowResults(true);
        const res = calculateScore();
        if (res.percentage >= 80 && window.confetti) {
          window.confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
        }
      };

      const saveWordToNotebook = (wordObj) => {
        if (!wordObj) return;
        if (savedWords.some(w => w.word.toLowerCase() === wordObj.word.toLowerCase())) {
          notify(`המילה "${wordObj.word}" כבר שמורה בפנקס המילים`);
          return;
        }
        setSavedWords([...savedWords, wordObj]);
        notify(`המילה "${wordObj.word}" נשמרה בהצלחה! ⭐`);
      };

      const fullPassageText = currentStory.sentences.join(" ");

      return (
        <div className="max-w-6xl mx-auto flex flex-col min-h-[92vh]" onClick={() => setSelectedWordInfo(null)}>
          <audio ref={audioRef} className="hidden" />

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-indigo-950 text-yellow-300 px-6 py-3 rounded-full shadow-2xl flex items-center space-x-3 space-x-reverse border-2 border-yellow-400">
              <i className="fas fa-star text-lg animate-bounce"></i>
              <span className="font-extrabold text-sm md:text-base">{toastMessage}</span>
            </div>
          )}

          {/* Book Header Bar */}
          <header className="bg-white/95 backdrop-blur rounded-3xl p-4 mb-4 shadow-xl border-2 border-indigo-200/80 flex flex-wrap items-center justify-between gap-3" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center space-x-3 space-x-reverse">
              <div className="w-12 h-12 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-2xl flex items-center justify-center text-indigo-950 text-2xl shadow-md border border-amber-300">
                <i className="fas fa-book-open"></i>
              </div>
              <div>
                <h1 className="text-xl md:text-2xl font-black text-indigo-950">ספר האנגלית שלי 📖</h1>
                <p className="text-xs md:text-sm font-bold text-indigo-600">קריאה קלה, דפדפוף דפים, רמזים חכמים ותרגום בלחיצה (כיתה ג')</p>
              </div>
            </div>

            {/* Book Controls & Story Selector */}
            <div className="flex items-center flex-wrap gap-2">
              <select
                value={currentStoryIndex}
                onChange={(e) => {
                  playPageFlipSound();
                  setCurrentStoryIndex(Number(e.target.value));
                }}
                className="bg-indigo-50 border-2 border-indigo-200 text-indigo-950 text-xs md:text-sm font-extrabold rounded-2xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm"
              >
                {stories.map((s, idx) => (
                  <option key={s.id} value={idx}>
                    עמוד {idx + 1}: {s.titleHebrew}
                  </option>
                ))}
              </select>

              <button
                onClick={() => setShowImportModal(true)}
                className="bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-xs md:text-sm px-3.5 py-2 rounded-2xl transition flex items-center space-x-2 space-x-reverse shadow"
              >
                <i className="fas fa-wand-magic-sparkles"></i>
                <span className="hidden sm:inline">הוסיפי סיפור</span>
              </button>

              <button
                onClick={() => setShowVocabularyModal(true)}
                className="bg-amber-400 hover:bg-amber-500 text-indigo-950 font-black text-xs md:text-sm px-3.5 py-2 rounded-2xl transition flex items-center space-x-2 space-x-reverse shadow relative"
              >
                <i className="fas fa-star"></i>
                <span>מילים שלי</span>
                {savedWords.length > 0 && (
                  <span className="bg-rose-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-extrabold">
                    {savedWords.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setShowSettingsModal(true)}
                className="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2.5 rounded-2xl transition"
                title="הגדרות קול"
              >
                <i className="fas fa-gear text-lg"></i>
              </button>
            </div>
          </header>

          {/* PAGE FLIPPING BOOK WRAPPER */}
          <main className={`flex-1 grid grid-cols-1 lg:grid-cols-12 rounded-3xl bg-book-paper border-4 border-book-border book-container relative overflow-visible mb-4 ${pageTurnAnimation}`}>
            
            {/* Center Book Spine Line (Desktop double-page spread effect) */}
            <div className="hidden lg:block absolute left-1/2 top-0 bottom-0 w-8 -ml-4 z-10 book-spine pointer-events-none"></div>

            {/* LEFT PAGE: Illustrated Story & Interactive Text with Inline Tooltips */}
            <section className="lg:col-span-6 p-6 md:p-8 flex flex-col justify-between border-b lg:border-b-0 lg:border-l-2 border-book-border relative bg-amber-50/30 rounded-t-3xl lg:rounded-tr-none lg:rounded-r-3xl">
              <div className="paper-corner"></div>

              <div>
                {/* Story Title & Speech Trigger Header */}
                <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                  <div>
                    <span className="inline-block bg-amber-200 text-amber-900 text-xs font-black px-3 py-1 rounded-full mb-1">
                      {currentStory.level}
                    </span>
                    <h2 className="text-2xl md:text-3xl font-black text-indigo-950 font-en text-left" dir="ltr">
                      {currentStory.title}
                    </h2>
                    <h3 className="text-base text-indigo-700 font-extrabold">
                      {currentStory.titleHebrew}
                    </h3>
                  </div>

                  <div className="flex items-center space-x-2 space-x-reverse bg-white p-2 rounded-2xl border border-amber-200 shadow-sm" onClick={(e) => e.stopPropagation()}>
                    {!isPlayingText ? (
                      <button
                        onClick={() => speakText(fullPassageText)}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white font-black px-3.5 py-2 rounded-xl text-xs flex items-center space-x-2 space-x-reverse transition shadow"
                      >
                        <i className="fas fa-volume-high"></i>
                        <span>הקראי עמוד</span>
                      </button>
                    ) : (
                      <button
                        onClick={stopSpeech}
                        className="bg-rose-500 hover:bg-rose-600 text-white font-black px-3.5 py-2 rounded-xl text-xs flex items-center space-x-2 space-x-reverse transition shadow animate-pulse"
                      >
                        <i className="fas fa-circle-stop"></i>
                        <span>עצרי הקראה</span>
                      </button>
                    )}

                    <select
                      value={playbackRate}
                      onChange={(e) => setPlaybackRate(Number(e.target.value))}
                      className="bg-amber-50 text-indigo-900 text-xs font-black rounded-lg px-2 py-1.5 border border-amber-300 outline-none"
                    >
                      <option value="0.7">🐢 איטי</option>
                      <option value="0.8">🐇 מומלץ</option>
                      <option value="1">⚡ רגיל</option>
                    </select>
                  </div>
                </div>

                {/* Story Illustration Header */}
                <div className="mb-4 shadow-sm rounded-2xl overflow-hidden border-2 border-amber-200/80 bg-white p-1">
                  {currentStory.illustration}
                </div>

                {/* Instruction Banner */}
                <div className="bg-yellow-100/90 border-r-4 border-yellow-500 p-2.5 rounded-2xl mb-4 text-yellow-950 text-xs font-extrabold flex items-center space-x-2 space-x-reverse shadow-sm">
                  <i className="fas fa-comment-dots text-amber-600 text-base"></i>
                  <span>לחצי על מילה באנגלית והתרגום יפתח בלון מיד מעליה!</span>
                </div>

                {/* Sentence Numbered Passage Display with Floating Inline Popovers */}
                <div className="space-y-3.5 bg-white p-5 rounded-2xl border-2 border-amber-200/60 shadow-inner text-left leading-relaxed relative" dir="ltr">
                  {currentStory.sentences.map((sentence, sIdx) => (
                    <div key={sIdx} className="flex items-start space-x-2 space-x-reverse">
                      <span className="sentence-badge shrink-0" title={`משפט ${sIdx + 1}`}>
                        {sIdx + 1}
                      </span>
                      <div className="flex-1 flex flex-wrap items-center">
                        {sentence.split(/\s+/).map((word, wIdx) => {
                          const cleanWord = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "");
                          const isSelected = selectedWordInfo && selectedWordInfo.word.toLowerCase() === cleanWord.toLowerCase();

                          return (
                            <div key={wIdx} className="interactive-word-wrapper">
                              <span
                                onClick={(e) => handleWordClick(word, sentence, e)}
                                className={`interactive-word ${isSelected ? 'active-word' : ''}`}
                              >
                                {word}
                              </span>

                              {/* INLINE POPOVER TOOLTIP BALLOON RIGHT ABOVE CLICKED WORD */}
                              {isSelected && (
                                <div
                                  className="word-tooltip-popover bg-indigo-950 text-white p-3 rounded-2xl shadow-2xl border-2 border-amber-400"
                                  onClick={(e) => e.stopPropagation()}
                                >
                                  <div className="flex items-center justify-between border-b border-indigo-800 pb-1.5 mb-1.5">
                                    <div className="flex items-center space-x-1.5 space-x-reverse">
                                      <span className="font-en text-lg font-black text-yellow-300" dir="ltr">{selectedWordInfo.word}</span>
                                      <span className="bg-indigo-800 text-indigo-200 text-[10px] px-1.5 py-0.5 rounded font-bold">
                                        {selectedWordInfo.pos}
                                      </span>
                                    </div>

                                    <button
                                      onClick={() => speakText(selectedWordInfo.word, 'en-US')}
                                      className="text-amber-400 hover:text-amber-200 p-1"
                                      title="השמיעי מילה"
                                    >
                                      <i className="fas fa-volume-high text-sm"></i>
                                    </button>
                                  </div>

                                  <div className="text-right text-sm font-black text-emerald-300 mb-2" dir="rtl">
                                    תרגום: {selectedWordInfo.hebrew}
                                  </div>

                                  <div className="flex items-center justify-between pt-1">
                                    <button
                                      onClick={() => saveWordToNotebook(selectedWordInfo)}
                                      className="bg-amber-400 hover:bg-amber-300 text-indigo-950 font-black px-2.5 py-1 rounded-lg text-[11px] flex items-center space-x-1 space-x-reverse transition shadow"
                                    >
                                      <i className="fas fa-star text-[10px]"></i>
                                      <span>שמרי במילים</span>
                                    </button>

                                    <button
                                      onClick={() => setSelectedWordInfo(null)}
                                      className="text-gray-300 hover:text-white text-xs font-bold"
                                    >
                                      סגרי ✕
                                    </button>
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Left Page Footer Indicator */}
              <div className="mt-4 pt-2 border-t border-amber-200 text-center text-xs font-bold text-indigo-400 flex justify-between items-center">
                <span>עמוד קריאה {currentStoryIndex * 2 + 1}</span>
                <span>ספר אנגלית לכיתה ג'</span>
              </div>
            </section>

            {/* RIGHT PAGE: Comprehension Questions with Intelligent Educational Hints */}
            <section className="lg:col-span-6 p-6 md:p-8 flex flex-col justify-between bg-white rounded-b-3xl lg:rounded-bl-none lg:rounded-l-3xl">
              
              <div>
                <div className="border-b-2 border-indigo-100 pb-3 mb-4 flex items-center justify-between">
                  <h3 className="text-xl font-black text-indigo-950 flex items-center space-x-2 space-x-reverse">
                    <i className="fas fa-pen-ruler text-indigo-600"></i>
                    <span>שאלות הבנה על הקטע</span>
                  </h3>
                  <span className="text-xs font-black bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">
                    {currentStory.questions.length} שאלות
                  </span>
                </div>

                <div className="space-y-4">
                  {currentStory.questions.map((q, qIndex) => {
                    const selectedOpt = userAnswers[q.id];
                    const isCorrect = selectedOpt === q.correct;
                    const isHintOpen = showHintMap[q.id];

                    return (
                      <div key={q.id} className="bg-indigo-50/60 p-4 rounded-2xl border-2 border-indigo-100/80">
                        
                        {/* Question Header & Line Reference */}
                        <div className="flex items-start justify-between gap-2 mb-2">
                          <div>
                            <div className="flex items-center space-x-2 space-x-reverse mb-1">
                              <span className="bg-indigo-600 text-white text-xs font-black px-2.5 py-0.5 rounded-lg">
                                שאלה {qIndex + 1}
                              </span>
                              
                              <span className="bg-amber-300 text-indigo-950 text-xs font-black px-2.5 py-0.5 rounded-lg flex items-center space-x-1 space-x-reverse shadow-sm">
                                <i className="fas fa-magnifying-glass text-[10px]"></i>
                                <span>קראי ב{q.lineRef}!</span>
                              </span>
                            </div>

                            <h4 className="text-base font-black text-indigo-950 leading-snug">
                              {q.questionHebrew}
                            </h4>
                            {q.questionEnglish && (
                              <p className="text-xs font-en text-gray-500 text-left mt-0.5" dir="ltr">
                                {q.questionEnglish}
                              </p>
                            )}
                          </div>

                          <button
                            onClick={() => toggleHint(q.id)}
                            className={`p-2 rounded-xl text-xs font-black transition flex items-center space-x-1 space-x-reverse shadow-sm ${
                              isHintOpen ? 'bg-amber-400 text-indigo-950' : 'bg-white text-amber-700 border border-amber-300 hover:bg-amber-50'
                            }`}
                            title="רמז חכם לפתרון"
                          >
                            <i className="fas fa-lightbulb"></i>
                            <span>רמז</span>
                          </button>
                        </div>

                        {/* General Intelligent Educational Hint */}
                        {isHintOpen && (
                          <div className="bg-amber-100/90 border-r-4 border-amber-500 p-2.5 rounded-xl text-xs font-extrabold text-amber-900 mb-3 animate-fadeIn">
                            <i className="fas fa-graduation-cap ml-1 text-amber-700"></i>
                            {q.hintHebrew}
                          </div>
                        )}

                        {/* Multiple Choice Options */}
                        <div className="space-y-2">
                          {q.options.map((opt, optIndex) => {
                            let btnStyle = "bg-white border-gray-200 text-gray-800 hover:border-indigo-400";
                            if (selectedOpt === optIndex) {
                              btnStyle = "bg-indigo-100 border-indigo-600 text-indigo-950 font-black shadow-sm";
                            }
                            if (showResults) {
                              if (optIndex === q.correct) {
                                btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-950 font-black";
                              } else if (selectedOpt === optIndex && !isCorrect) {
                                btnStyle = "bg-rose-100 border-rose-400 text-rose-900 font-bold";
                              }
                            }

                            return (
                              <button
                                key={optIndex}
                                onClick={() => handleOptionSelect(q.id, optIndex)}
                                disabled={showResults}
                                className={`w-full text-right p-3 rounded-xl border-2 text-xs md:text-sm transition flex items-center justify-between ${btnStyle}`}
                              >
                                <span>{opt}</span>
                                {showResults && optIndex === q.correct && (
                                  <i className="fas fa-circle-check text-emerald-600 text-lg"></i>
                                )}
                                {showResults && selectedOpt === optIndex && !isCorrect && (
                                  <i className="fas fa-circle-xmark text-rose-500 text-lg"></i>
                                )}
                              </button>
                            );
                          })}
                        </div>

                        {/* Answer explanation */}
                        {showResults && (
                          <div className={`mt-3 p-2.5 rounded-xl text-xs font-extrabold ${isCorrect ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'}`}>
                            <i className={`fas ${isCorrect ? 'fa-thumbs-up' : 'fa-circle-info'} ml-1`}></i>
                            {q.explanation}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Bottom Submit Actions */}
              <div className="mt-5 pt-3 border-t-2 border-indigo-100">
                {!showResults ? (
                  <button
                    onClick={handleCheckQuiz}
                    disabled={Object.keys(userAnswers).length < currentStory.questions.length}
                    className={`w-full py-3.5 rounded-2xl text-base font-black transition shadow-lg flex items-center justify-center space-x-2 space-x-reverse ${
                      Object.keys(userAnswers).length < currentStory.questions.length
                        ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                        : 'bg-emerald-500 hover:bg-emerald-600 text-white'
                    }`}
                  >
                    <i className="fas fa-check-double"></i>
                    <span>בדקי תשובות בשאלון</span>
                  </button>
                ) : (
                  <div className="bg-indigo-950 text-white p-4 rounded-2xl flex items-center justify-between">
                    <div>
                      <div className="text-xs text-indigo-200 font-bold">הציון שלך:</div>
                      <div className="text-2xl font-black text-yellow-300">
                        {calculateScore().score} / {calculateScore().total} ({calculateScore().percentage}%)
                      </div>
                    </div>
                    <button
                      onClick={() => setShowResults(false)}
                      className="bg-white text-indigo-950 hover:bg-indigo-50 font-black px-4 py-2 rounded-xl text-xs transition"
                    >
                      נסי שוב 🔄
                    </button>
                  </div>
                )}

                {/* Right Page Footer Indicator */}
                <div className="mt-3 text-center text-xs font-bold text-indigo-400">
                  עמוד שאלות {currentStoryIndex * 2 + 2}
                </div>
              </div>

            </section>
          </main>

          {/* PAGE FLIP FLIPPER NAVIGATION BAR */}
          <div className="bg-indigo-950 text-white rounded-2xl p-3 flex items-center justify-between shadow-2xl border-2 border-indigo-800" onClick={(e) => e.stopPropagation()}>
            <button
              onClick={goToPrevPage}
              disabled={currentStoryIndex === 0}
              className={`px-5 py-2.5 rounded-xl font-black text-xs md:text-sm flex items-center space-x-2 space-x-reverse transition shadow ${
                currentStoryIndex === 0
                  ? 'bg-gray-800 text-gray-500 cursor-not-allowed'
                  : 'bg-amber-400 hover:bg-amber-300 text-indigo-950'
              }`}
            >
              <i className="fas fa-arrow-right"></i>
              <span>העמוד הקודם</span>
            </button>

            <div className="text-center">
              <span className="text-xs font-extrabold text-amber-300 block">
                סיפור {currentStoryIndex + 1} מתוך {stories.length}
              </span>
              <span className="text-[11px] text-indigo-300 font-bold">
                {currentStory.titleHebrew}
              </span>
            </div>

            <button
              onClick={goToNextPage}
              disabled={currentStoryIndex === stories.length - 1}
              className={`px-5 py-2.5 rounded-xl font-black text-xs md:text-sm flex items-center space-x-2 space-x-reverse transition shadow ${
                currentStoryIndex === stories.length - 1
                  ? 'bg-gray-800 text-gray-500 cursor-not-allowed'
                  : 'bg-amber-400 hover:bg-amber-300 text-indigo-950'
              }`}
            >
              <span>העמוד הבא</span>
              <i className="fas fa-arrow-left"></i>
            </button>
          </div>

          {}
          {showImportModal && (
            <CustomTextImportModal
              onClose={() => setShowImportModal(false)}
              apiKey={geminiApiKey}
              onAddStory={(newStory) => {
                setStories([...stories, newStory]);
                setCurrentStoryIndex(stories.length);
                setShowImportModal(false);
                notify("הסיפור החדש נוסף בהצלחה לספר!");
              }}
            />
          )}

          {showVocabularyModal && (
            <VocabularyModal
              savedWords={savedWords}
              onClose={() => setShowVocabularyModal(false)}
              onRemove={(w) => setSavedWords(savedWords.filter(item => item.word !== w.word))}
              onSpeak={(text) => speakText(text, 'en-US')}
            />
          )}

          {showSettingsModal && (
            <SettingsModal
              onClose={() => setShowSettingsModal(false)}
              voiceSource={voiceSource}
              setVoiceSource={setVoiceSource}
              apiKey={geminiApiKey}
              setApiKey={setGeminiApiKey}
            />
          )}

          <footer className="text-center py-3 text-xs text-indigo-200 font-bold">
            ספר קריאה באנגלית אינטראקטיבי - מותאם לתלמידי כיתה ג' ✨
          </footer>
        </div>
      );
    }

    function CustomTextImportModal({ onClose, onAddStory, apiKey }) {
      const [passageText, setPassageText] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      const handleCreateWithAI = async () => {
        if (!passageText.trim()) return;
        setIsGenerating(true);

        try {
          const prompt = `Adapt this text for a 3rd grade English student in Israel.
          Input text: "${passageText}"

          Return ONLY a JSON object with this format:
          {
            "title": "English Title",
            "titleHebrew": "כותרת בעברית",
            "level": "כיתה ג׳ - סיפור שלי",
            "sentences": ["Sentence 1", "Sentence 2", "Sentence 3"],
            "questions": [
              {
                "id": "q1",
                "lineRef": "משפט 1",
                "questionHebrew": "שאלה בעברית על משפט 1?",
                "questionEnglish": "Question in English",
                "hintHebrew": "רמז חכם בעברית לקוראת...",
                "options": ["תשובה 1", "תשובה 2", "תשובה 3"],
                "correct": 0,
                "explanation": "הסבר קצר בעברית"
              }
            ],
            "dictionary": {}
          }`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (!response.ok) throw new Error("Generation failed");
          const data = await response.json();
          const parsed = JSON.parse(data.candidates[0].content.parts[0].text);

          const newStory = {
            id: 'custom-' + Date.now(),
            title: parsed.title || 'My Story',
            titleHebrew: parsed.titleHebrew || 'הסיפור שלי',
            level: 'כיתה ג׳ - סיפור מותאם',
            illustration: (
              <div className="w-full h-36 rounded-2xl bg-indigo-100 flex items-center justify-center text-indigo-500 text-4xl">
                <i className="fas fa-star text-amber-400"></i>
              </div>
            ),
            sentences: parsed.sentences || passageText.split(/(?<=[.?!])\s+/),
            questions: parsed.questions || [],
            dictionary: parsed.dictionary || {}
          };

          onAddStory(newStory);
        } catch (e) {
          const fallbackStory = {
            id: 'custom-' + Date.now(),
            title: 'My Story',
            titleHebrew: 'הסיפור שלי',
            level: 'כיתה ג׳',
            illustration: (
              <div className="w-full h-36 rounded-2xl bg-indigo-100 flex items-center justify-center text-indigo-500 text-4xl">
                <i className="fas fa-book-open"></i>
              </div>
            ),
            sentences: passageText.split(/(?<=[.?!])\s+/),
            questions: [
              {
                id: 'q1',
                lineRef: "משפט 1",
                questionHebrew: "האם קראת את הקטע?",
                questionEnglish: "Did you read the story?",
                hintHebrew: "רמז: התבונני במשפט הראשון בקטע הקריאה!",
                options: ["כן, קראתי בהצלחה", "עדיין לא"],
                correct: 0,
                explanation: "כל הכבוד!"
              }
            ],
            dictionary: {}
          };
          onAddStory(fallbackStory);
        } finally {
          setIsGenerating(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={(e) => e.stopPropagation()}>
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl relative border-2 border-indigo-100">
            <button onClick={onClose} className="absolute top-4 left-4 text-gray-400 hover:text-gray-600 text-lg">
              <i className="fas fa-xmark"></i>
            </button>

            <h3 className="text-2xl font-black text-indigo-950 mb-2 flex items-center space-x-2 space-x-reverse">
              <i className="fas fa-wand-magic-sparkles text-emerald-500"></i>
              <span>הוסיפי סיפור חדש לספר</span>
            </h3>
            <p className="text-xs text-gray-600 mb-4">
              הדביקי טקסט באנגלית. הבינה המלאכותית תעצב ממנו סיפור עם מספרי משפטים, רמזים חכמים ושאלות לכיתה ג'!
            </p>

            <textarea
              rows="5"
              value={passageText}
              onChange={(e) => setPassageText(e.target.value)}
              placeholder="Write or paste English text here..."
              className="w-full bg-indigo-50/50 border-2 border-indigo-200 rounded-2xl p-3 text-sm font-en focus:ring-2 focus:ring-indigo-400 outline-none text-left mb-4"
              dir="ltr"
            ></textarea>

            <button
              onClick={handleCreateWithAI}
              disabled={isGenerating || !passageText.trim()}
              className={`w-full py-3.5 rounded-2xl font-black text-white text-sm transition shadow-lg flex items-center justify-center space-x-2 space-x-reverse ${
                isGenerating || !passageText.trim()
                  ? 'bg-gray-300 cursor-not-allowed'
                  : 'bg-emerald-500 hover:bg-emerald-600'
              }`}
            >
              {isGenerating ? (
                <>
                  <i className="fas fa-spinner fa-spin"></i>
                  <span>מתאים את הסיפור והשאלות לכיתה ג'...</span>
                </>
              ) : (
                <>
                  <i className="fas fa-book"></i>
                  <span>צור דף ספר אינטראקטיבי</span>
                </>
              )}
            </button>
          </div>
        </div>
      );
    }

    function VocabularyModal({ savedWords, onClose, onRemove, onSpeak }) {
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={(e) => e.stopPropagation()}>
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative border-2 border-indigo-100 max-h-[85vh] flex flex-col">
            <button onClick={onClose} className="absolute top-4 left-4 text-gray-400 hover:text-gray-600 text-lg">
              <i className="fas fa-xmark"></i>
            </button>

            <div className="mb-4">
              <h3 className="text-xl font-black text-indigo-950 flex items-center space-x-2 space-x-reverse">
                <i className="fas fa-star text-amber-400"></i>
                <span>פנקס המילים השמורות שלי</span>
              </h3>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
              {savedWords.length === 0 ? (
                <div className="text-center py-10 text-gray-400">
                  <i className="fas fa-star text-3xl mb-2 text-amber-200"></i>
                  <p className="text-sm font-bold">עדיין לא שמרת מילים בפנקס</p>
                </div>
              ) : (
                savedWords.map((item, idx) => (
                  <div key={idx} className="bg-amber-50 p-3.5 rounded-2xl border border-amber-200 flex items-center justify-between gap-3">
                    <div>
                      <div className="flex items-center space-x-2 space-x-reverse">
                        <span className="text-lg font-black font-en text-indigo-950" dir="ltr">{item.word}</span>
                        <button onClick={() => onSpeak(item.word)} className="text-indigo-600">
                          <i className="fas fa-volume-high text-xs"></i>
                        </button>
                      </div>
                      <div className="text-sm font-black text-emerald-700">
                        {item.hebrew}
                      </div>
                    </div>

                    <button
                      onClick={() => onRemove(item)}
                      className="text-rose-500 hover:text-rose-700 p-2"
                    >
                      <i className="fas fa-trash-can"></i>
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    function SettingsModal({ onClose, voiceSource, setVoiceSource, apiKey, setApiKey }) {
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={(e) => e.stopPropagation()}>
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative border-2 border-indigo-100">
            <button onClick={onClose} className="absolute top-4 left-4 text-gray-400 hover:text-gray-600 text-lg">
              <i className="fas fa-xmark"></i>
            </button>

            <h3 className="text-lg font-black text-indigo-950 mb-4 flex items-center space-x-2 space-x-reverse">
              <i className="fas fa-gear text-indigo-600"></i>
              <span>הגדרות קול והקראה</span>
            </h3>

            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-gray-700 mb-2">מנוע הקראה:</label>
                <div className="space-y-2">
                  <label className="flex items-center space-x-3 space-x-reverse bg-indigo-50/60 p-3 rounded-2xl border border-indigo-100 cursor-pointer">
                    <input
                      type="radio"
                      name="voice"
                      value="browser"
                      checked={voiceSource === 'browser'}
                      onChange={() => setVoiceSource('browser')}
                      className="text-indigo-600"
                    />
                    <span className="text-xs font-bold text-indigo-950">הקראת דפדפן (Standard Speech)</span>
                  </label>

                  <label className="flex items-center space-x-3 space-x-reverse bg-indigo-50/60 p-3 rounded-2xl border border-indigo-100 cursor-pointer">
                    <input
                      type="radio"
                      name="voice"
                      value="gemini"
                      checked={voiceSource === 'gemini'}
                      onChange={() => setVoiceSource('gemini')}
                      className="text-indigo-600"
                    />
                    <span className="text-xs font-bold text-indigo-950">הקראת Gemini AI Voice (קול אנושי טבעי)</span>
                  </label>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">Gemini API Key (במידת הצורך):</label>
                <input
                  type="password"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="הזן API Key..."
                  className="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-xs outline-none"
                />
              </div>

              <button
                onClick={onClose}
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition"
              >
                סגור
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
